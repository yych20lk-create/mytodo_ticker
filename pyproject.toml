[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zentray"
version = "0.4.2"
description = "跨平台个人任务管理与专注效率工具 —— 系统托盘番茄钟 + GTD 看板"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Zen-Geek"}
]
keywords = ["todo", "productivity", "pomodoro", "gtd", "tray", "task-manager"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Scheduling",
    "Topic :: Desktop Environment",
]

requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6.0",
    "requests>=2.31.0",
    "pynput>=1.7.6",
    "injector>=0.21.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ai = ["openai>=1.12.0"]
mysql = ["sqlalchemy>=2.0", "pymysql>=1.1.0"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
]

[project.scripts]
zentray = "zentray.main:main"

[project.urls]
Homepage = "https://github.com/zen-geek/zentray"
Issues = "https://github.com/zen-geek/zentray/issues"
Documentation = "https://github.com/zen-geek/zentray#readme"

[tool.setuptools.packages.find]
include = ["zentray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
