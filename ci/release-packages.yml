# 在 Windows / macOS runner 上构建安装包并上传到 GitHub Release。
# Linux .deb 可在本机 scripts/build_package.sh 生成后上传。
#
# 用法:
#   gh workflow run release-packages.yml -f tag=v0.4.2
#   或：发布带 tag 的 Release 后手动 dispatch / 在 Actions 页触发
name: Release Packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach assets to (e.g. v0.4.2)"
        required: true
        type: string
      ref:
        description: "Git ref to build (default: same as tag)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-packages-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend
        shell: bash
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Python deps
        shell: bash
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]" pyinstaller

      - name: PyInstaller main app
        shell: bash
        run: python -m PyInstaller zentray.spec --noconfirm

      - name: PyInstaller installer
        shell: bash
        run: python -m PyInstaller installer.spec --noconfirm

      - name: Stage asset
        id: stage
        shell: bash
        run: |
          VERSION=$(python -c "from zentray.config import VERSION; print(VERSION)")
          mkdir -p dist/releases
          SRC="dist/ZenTrayInstaller.exe"
          test -f "$SRC" || { echo "missing $SRC"; ls -la dist; exit 1; }
          OUT="dist/releases/ZenTrayInstaller-${VERSION}-x64.exe"
          cp -a "$SRC" "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload to Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "${{ steps.stage.outputs.asset }}" --clobber
          echo "Uploaded ${{ steps.stage.outputs.asset }} → $TAG"

  macos:
    name: macOS DMG (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || inputs.tag }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build Vue frontend
        run: |
          cd web
          npm ci
          npm run build

      - name: Install Python deps
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[dev]" pyinstaller

      - name: PyInstaller main app
        run: python -m PyInstaller zentray.spec --noconfirm

      - name: Stage DMG
        id: stage
        run: |
          set -euo pipefail
          VERSION=$(python -c "from zentray.config import VERSION; print(VERSION)")
          ARCH="${{ matrix.arch }}"
          BIN="dist/ZenTray"
          test -f "$BIN" || { echo "missing $BIN"; ls -la dist; exit 1; }
          chmod +x "$BIN"
          STAGE="build/dmg_stage"
          rm -rf "$STAGE"
          mkdir -p "$STAGE" dist/releases
          cp -a "$BIN" "$STAGE/ZenTray"
          ln -sf /Applications "$STAGE/Applications"
          OUT="dist/releases/ZenTray-${VERSION}-${ARCH}.dmg"
          hdiutil create -volname "ZenTray" -srcfolder "$STAGE" -ov -format UDZO "$OUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release view "$TAG" >/dev/null
          gh release upload "$TAG" "${{ steps.stage.outputs.asset }}" --clobber
          echo "Uploaded ${{ steps.stage.outputs.asset }} → $TAG"
